# Ingest NPM (Taipei) open data for one dynasty axis, then validate + commit.
# Run per-dynasty via dispatch; a weekly cron for NPM is added once all
# axes have their first full pass.
# NOTE: dynasty input uses English keys (song/ming/...) because non-ASCII
# dispatch payloads get mangled (ASCII-cast to '?') on the way in.
name: npm-sync
on:
  workflow_dispatch:
    inputs:
      dynasty:
        description: "Axis key: song/ming/qing/tang/... or 'all'"
        required: false
        default: "song"
      limit:
        description: "Max items this run (0 = unlimited)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache NPM raw (resume across runs)
        uses: actions/cache@v4
        with:
          path: raw/npm
          key: npm-raw-${{ github.run_id }}
          restore-keys: |
            npm-raw-

      - name: Crawl NPM open data
        run: |
          python collectors/npm_collector.py \
            --dynasty "${{ github.event.inputs.dynasty }}" \
            --limit ${{ github.event.inputs.limit }} \
            --sleep 0.5

      - name: Re-map existing relics (mapping upgrades, no network)
        run: python collectors/npm_collector.py --remap

      - name: Validate
        run: python pipeline/validate.py

      - name: Commit new relics
        run: |
          git config user.name "wenwu-bot"
          git config user.email "bot@wenwu.local"
          git add data/relics
          if git diff --cached --quiet; then
            echo "no new NPM data"
          else
            git commit -m "data: NPM ${{ github.event.inputs.dynasty }} batch"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin master && git push; then ok=1; break; fi
              echo "push attempt $i failed, retrying after rebase"
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "::error::push failed after 3 rebase retries"
              exit 1
            fi
          fi
