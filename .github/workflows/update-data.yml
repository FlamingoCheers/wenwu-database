name: update-data

on:
  schedule:
    - cron: "0 21 * * 5"   # 姣忓懆浜?UTC 21:00锛堝寳浜椂闂村懆鍏?05:00锛?  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 棣栨鍏ㄩ噺鐖?Met 绾?3.5h锛涗箣鍚庢瘡鍛ㄥ閲忓彧闇€鍑犲垎閽?    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缂撳瓨 Met raw锛堣法璺戞柇鐐圭画鐖級
        uses: actions/cache@v4
        with:
          path: raw/met
          key: met-raw-${{ github.run_id }}
          restore-keys: |
            met-raw-

      - name: 澧為噺閲囬泦 A 绫绘簮锛圡et Open Access锛屽苟鍙戯級
        run: python collectors/met_collector.py --limit 0 --workers 6

      - name: 閲嶆槧灏勫凡鏈夎褰曪紙鏄犲皠瑙勫垯鍗囩骇鏃朵紶鎾級
        run: python collectors/met_collector.py --remap

      - name: 鏋勫缓 SQLite 蹇収
        run: python pipeline/build_db.py

      - name: 鎻愪氦骞舵帹閫?        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/relics
          if git diff --cached --quiet; then
            echo "鏃犳柊澧炴暟鎹?
          else
            git commit -m "鏁版嵁鏇存柊: $(date -u +%F) 澧為噺閲囬泦"
            git push
          fi
