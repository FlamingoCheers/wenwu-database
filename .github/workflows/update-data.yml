# Weekly refresh: incremental A-class collection + rebuild SQLite snapshot
# Note: raw cache persists via actions/cache; full Met crawl takes ~3.5h on first run
name: update-data

on:
  schedule:
    - cron: "0 21 * * 5"   # Fri 21:00 UTC = Sat 05:00 Beijing
  workflow_dispatch:
    inputs:
      limit:
        description: "Max objects this run (0 = unlimited; batch with e.g. 8000)"
        required: false
        default: "0"
      workers:
        description: "Concurrent fetch workers"
        required: false
        default: "12"

permissions:
  contents: write

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # first full Met crawl ~3.5h; weekly incremental is minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Met raw (resume across runs)
        uses: actions/cache@v4
        with:
          path: raw/met
          key: met-raw-${{ github.run_id }}
          restore-keys: |
            met-raw-

      - name: Bulk filter + collect China PD subset (Met)
        run: python collectors/met_bulk.py --limit ${{ github.event.inputs.limit || 0 }} --workers 4 --sleep 0.4

      - name: Remap existing records (propagate mapping upgrades)
        run: python collectors/met_collector.py --remap

      - name: Build SQLite snapshot
        run: python pipeline/build_db.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/relics
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: incremental update $(date -u +%F)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin master && git push; then ok=1; break; fi
              echo "push attempt $i failed, retrying after rebase"
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "::error::push failed after 3 rebase retries"
              exit 1
            fi
          fi
