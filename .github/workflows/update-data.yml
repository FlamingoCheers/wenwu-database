name: update-data

on:
  schedule:
    - cron: "0 21 * * 5"   # 每周五 UTC 21:00（北京时间周六 05:00）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 首次全量爬 Met 约 3.5h；之后每周增量只需几分钟
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 Met raw（跨跑断点续爬）
        uses: actions/cache@v4
        with:
          path: raw/met
          key: met-raw-${{ github.run_id }}
          restore-keys: |
            met-raw-

      - name: 增量采集 A 类源（Met Open Access，并发）
        run: python collectors/met_collector.py --limit 0 --workers 6

      - name: 重映射已有记录（映射规则升级时传播）
        run: python collectors/met_collector.py --remap

      - name: 构建 SQLite 快照
        run: python pipeline/build_db.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/relics sqlite/
          if git diff --cached --quiet; then
            echo "无新增数据"
          else
            git commit -m "数据更新: $(date -u +%F) 增量采集"
            git push
          fi
