name: npm-url-probe
on:
  workflow_dispatch:
    inputs:
      oid:
        description: "Detail oid to probe (default 1337)"
        default: "1337"
      dep:
        description: "dep code (U/I/B/A/C)"
        default: "U"

permissions:
  contents: read

# 礼貌原则: 手动触发、单线程、仅 2 个请求、间隔 3 秒、只读不推送
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Restore npm raw cache (no requests)
        uses: actions/cache/restore@v4
        with:
          path: raw/npm
          key: npm-raw-notexist
          restore-keys: |
            npm-raw-
      - name: Inspect cached crawl (offline)
        run: |
          python - <<'PY'
          import pathlib, re
          d = pathlib.Path("raw/npm")
          if not d.exists():
              print("no cache restored"); raise SystemExit
          f = d / "detail_1337.html"
          if f.exists():
              h = f.read_text(encoding="utf-8", errors="replace")
              m = re.search(r"<title>(.*?)</title>", h, re.S)
              print("cached detail_1337 title:", m.group(1) if m else "?")
              m = re.search(r"品名(.{0,120})", h, re.S)
              print("cached 品名 context:", re.sub(r"<[^>]+>", "", m.group(1))[:80] if m else "?")
          else:
              print("detail_1337.html not in cache")
          hits = 0
          for f in sorted(d.glob("list_*.html")):
              t = f.read_text(encoding="utf-8", errors="replace")
              for m in re.finditer(r"山居留客", t):
                  s = max(0, m.start() - 400)
                  ctx = t[s:m.start() + 100]
                  mm = re.findall(r'href="(/opendata/Pub/Detail/(\d+)\?dep=([A-Z]))[^"]*"', ctx)
                  print(f.parent, f.name, "hit ->", mm[-1] if mm else "no href in ctx")
                  hits += 1
                  if hits >= 3: break
              if hits >= 3: break
          print("list hits:", hits)
          PY
      - name: Probe robots.txt and one detail page
        run: |
          python - <<'PY'
          import json, re, time, requests

          S = requests.Session()
          S.headers.update({
              "User-Agent": "wenwu-database-research/1.0 (contact: repo owner)",
              "Accept-Language": "zh-TW,zh;q=0.9",
          })

          # 1) robots.txt
          r = S.get("https://digitalarchive.npm.gov.tw/robots.txt", timeout=30)
          print("robots.txt status:", r.status_code)
          print(r.text[:2000])
          time.sleep(3)

          # 2) 单个 Detail 页静态 HTML
          oid = "${{ inputs.oid }}"
          dep = "${{ inputs.dep }}"
          url = f"https://digitalarchive.npm.gov.tw/opendata/Pub/Detail/{oid}?dep={dep}&mode=full"
          r = S.get(url, timeout=30)
          print("detail status:", r.status_code, "bytes:", len(r.content))
          r.encoding = "utf-8"
          html = r.text
          import pathlib
          pathlib.Path("raw").mkdir(exist_ok=True)
          pathlib.Path(f"raw/probe_detail_{oid}.html").write_text(html, encoding="utf-8")

          # 3) 关键线索: canonical / og:url / title / 主题站链接
          for pat in [r'<link[^>]*rel="canonical"[^>]*>', r'<meta[^>]*og:url[^>]*>',
                      r"<title>.*?</title>",
                      r'href="(https?://theme\.npm\.edu\.tw[^"]*)"',
                      r'href="(https?://digitalarchive\.npm\.gov\.tw/(?!opendata)[^"]*)"']:
              hits = re.findall(pat, html)[:8]
              print(pat, "=>", hits)
          time.sleep(3)

          # 4) opendata 单件 API 对照(同 oid, 第三也是最后一个请求)
          r = S.get("https://digitalarchive.npm.gov.tw/opendata/OpenDataSearch",
                    params={"type": "detail", "oid": oid, "dep": dep}, timeout=30)
          print("api status:", r.status_code, "head:", r.text[:600])
          PY
      - name: Upload probe html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-html
          path: raw/probe_detail_*.html
          retention-days: 7
