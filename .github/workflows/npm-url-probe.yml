name: npm-url-probe
on:
  workflow_dispatch:
    inputs:
      oid:
        description: "Detail oid to probe (default 1337)"
        default: "1337"
      dep:
        description: "dep code (U/I/B/A/C)"
        default: "U"

permissions:
  contents: read

# 礼貌原则: 手动触发、单线程、仅 2 个请求、间隔 3 秒、只读不推送
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Restore npm raw cache (no requests)
        uses: actions/cache/restore@v4
        with:
          path: raw/npm
          key: npm-raw-notexist
          restore-keys: |
            npm-raw-
      - name: Inspect cached crawl (offline)
        run: |
          python - <<'PY'
          import pathlib, re
          d = pathlib.Path("raw/npm")
          if not d.exists():
              print("no cache restored"); raise SystemExit
          f = d / "detail_1337.html"
          if f.exists():
              h = f.read_text(encoding="utf-8", errors="replace")
              m = re.search(r"<title>(.*?)</title>", h, re.S)
              print("cached detail_1337 title:", m.group(1) if m else "?")
              m = re.search(r"品名(.{0,120})", h, re.S)
              print("cached 品名 context:", re.sub(r"<[^>]+>", "", m.group(1))[:80] if m else "?")
          else:
              print("detail_1337.html not in cache")
          hits = 0
          for f in sorted(d.glob("list_*.html")):
              t = f.read_text(encoding="utf-8", errors="replace")
              for m in re.finditer(r"山居留客", t):
                  s = max(0, m.start() - 400)
                  ctx = t[s:m.start() + 100]
                  mm = re.findall(r'href="(/opendata/Pub/Detail/(\d+)\?dep=([A-Z]))[^"]*"', ctx)
                  print(f.parent, f.name, "hit ->", mm[-1] if mm else "no href in ctx")
                  hits += 1
                  if hits >= 3: break
              if hits >= 3: break
          print("list hits:", hits)
          PY
      - name: Multi-page dep letter scan (3 requests)
        run: |
          python - <<'PY'
          import json, re, time, urllib.request, pathlib, collections

          BASE = "https://digitalarchive.npm.gov.tw"
          SEARCH_URL = BASE + "/opendata/Pub/Search"
          UA = {"User-Agent": "wenwu-database-research/1.0 (contact: repo owner)"}
          out = pathlib.Path("raw/npm_probe"); out.mkdir(parents=True, exist_ok=True)

          def post_page(p, attempts=3):
              body = {"RegisterType": None, "IndexYear": None,
                      "WestBeginYear": 960, "WestEndYear": 1279,
                      "YearDisplay": "960~1279~宋", "SearchContent": None,
                      "RegisterTypeEng": None,
                      "PageInfo": {"PageIndex": p, "PageSize": 50, "PageCount": 0}}
              req = urllib.request.Request(
                  SEARCH_URL, data=json.dumps(body, ensure_ascii=False).encode("utf-8"),
                  headers={**UA, "Content-Type": "application/json",
                           "Referer": BASE + "/opendata"}, method="POST")
              last = None
              for i in range(attempts):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read().decode("utf-8", errors="replace")
                  except Exception as e:
                      last = e
                      print(f"  attempt {i+1} failed: {type(e).__name__}: {e}")
                      time.sleep(5)
              raise last

          DETAIL_RE = re.compile(
              r'href="(?:/opendata/Pub/Detail/(\d+)\?dep=([A-Z]))&amp;mode=full"')
          CAPTION_RE = re.compile(r'<img[^>]+alt="([^"]{2,40})"')

          for p in (2, 25, 60):
              html = post_page(p)
              (out / f"song_p{p}.html").write_text(html, encoding="utf-8")
              pairs = DETAIL_RE.findall(html)
              deps = collections.Counter(d for _, d in pairs)
              print(f"page {p}: items={len(pairs)} deps={dict(deps)}")
              if pairs:
                  print("  first3:", pairs[:3])
                  print("  alts  :", CAPTION_RE.findall(html)[:6])
              else:
                  print("  (empty page - likely beyond page count)")
              time.sleep(3)
          PY
      - name: Upload probe html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-html
          path: raw/npm_probe/
          retention-days: 7
