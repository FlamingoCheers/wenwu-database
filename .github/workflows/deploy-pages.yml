name: deploy-pages

on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "pipeline/**"
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  # GITHUB_TOKEN 提交不会触发 push 事件（防递归），数据更新全走 Actions
  # bot 提交，所以必须用 workflow_run 兜底，否则站点会一直停在手动推送的版本
  workflow_run:
    workflows: [update-data, npm-sync, nmc-sync]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # push/dispatch 直接跑；workflow_run 仅在上游数据流程成功时才重建
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build web index
        run: python pipeline/build_web_index.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
