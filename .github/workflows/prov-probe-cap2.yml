# Capital Museum API discovery round 2 (dispatch only).
name: prov-probe-cap2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe
        run: python pipeline/prov_probe_cap2.py

      - uses: actions/upload-artifact@v4
        with:
          name: prov-probe3
          path: raw/probe3/
          retention-days: 7
