# GPM (北京故宫数字文物库 digicol.dpm.org.cn) curated-masterpiece sync.
# Search-card parsing via playwright (no encrypted-API reverse engineering).
# Keywords with real results are tracked in raw/_gpm_kw_done.json; once all
# keywords are done this workflow becomes a cheap no-op (state file in cache).
# Runs on demand / quarterly — the curated set is nearly static.
name: gpm-sync

on:
  schedule:
    - cron: "0 3 5 1,4,7,10 *"   # 05 Jan/Apr/Jul/Oct 03:00 UTC = 11:00 Beijing
  workflow_dispatch:
    inputs:
      sleep:
        description: "Seconds between keyword searches"
        required: false
        default: "4"

permissions:
  contents: write

jobs:
  gpm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playwright + chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Cache GPM state + raw
        uses: actions/cache@v4
        with:
          path: |
            raw/_gpm_kw_done.json
            raw/gpm
          key: gpm-state-${{ github.run_id }}
          restore-keys: |
            gpm-state-

      - name: Harvest remaining keywords
        run: python collectors/gpm_collector.py --limit 0

      - name: Validate
        run: python pipeline/validate.py

      - name: Build SQLite snapshot
        run: python pipeline/build_db.py

      - name: Commit and push
        run: |
          git config user.name "wenwu-bot"
          git config user.email "bot@wenwu.local"
          git add data/relics
          if git diff --cached --quiet; then
            echo "no new GPM data"
          else
            git commit -m "data: GPM curated batch $(date -u +%F)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin master && git push; then ok=1; break; fi
              echo "push attempt $i failed, retrying after rebase"
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "::error::push failed after 3 rebase retries"
              exit 1
            fi
          fi
